[project]
name = "kdp-factory"
version = "0.1.0"
description = "Système multi-agents (LangGraph + Claude) pour la production de livres Amazon KDP — France & UK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Dépendances activées uniquement quand on branche le RAG (voir src/kdp_factory/rag).
rag = [
    "chromadb>=0.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
kdp = "kdp_factory.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdp_factory"]

[tool.ruff]
line-length = 100
target-version = "py311"
